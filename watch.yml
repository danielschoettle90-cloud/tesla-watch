name: Tesla Inventory Watch

on:
  # Läuft an Minute 0, 10, 30, 40 jeder Stunde
  # => Abstände: 10 min, 20 min, 10 min, 20 min (wiederholt sich jede Stunde)
  schedule:
    - cron: '0,10,30,40 * * * *'
  workflow_dispatch: {}   # erlaubt manuelles Starten über den "Actions" Tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TESLA_INVENTORY_URL: ${{ secrets.TESLA_INVENTORY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python watch.py

      - name: Commit updated state
        run: |
          git config user.name "tesla-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push
